  var host = document.createElement("div");
  host.id = "assistant-gite-host";
  host.style.cssText = "position:fixed;" + vert + ":" + CONFIG.MARGE_Y + "px;" + cote + ":" + CONFIG.MARGE_X + "px;z-index:" + CONFIG.Z_INDEX + ";";
  document.body.appendChild(host);
  var root = host.attachShadow({ mode: "open" });

  var css = [
    ':host{all:initial}',
    '*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}',
    'button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid ' + C + ';outline-offset:2px}',

    /* Bouton flottant : apparition, survol, bascule initiale <-> croix, anneau d'attention, pastille */
    '#fab{position:relative;width:58px;height:58px;border-radius:50%;border:0;padding:0;background:' + C + ';color:#fff;font-size:22px;font-weight:700;cursor:pointer;' +
      'box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .2s ease,box-shadow .2s ease;animation:fabIn .5s cubic-bezier(.34,1.56,.64,1) .3s backwards}',
    '#fab:hover{transform:scale(1.07);box-shadow:0 6px 20px rgba(0,0,0,.3)}',
    '#fab:active{transform:scale(.95)}',
    '#fab .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;transition:opacity .2s ease,transform .3s ease}',
    '#fab .ico img{width:100%;height:100%;object-fit:cover}',
    '#fab .ico-x{opacity:0;transform:rotate(-90deg) scale(.5);font-size:30px;font-weight:300}',
    '#fab.on .ico-a{opacity:0;transform:rotate(90deg) scale(.5)}',
    '#fab.on .ico-x{opacity:1;transform:none}',
    '#fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid ' + C + ';opacity:0;pointer-events:none;animation:pulse 1.8s ease-out 1.2s 2}',
    '#fab.vu::after{animation:none}',
    '#fab.notif::before{content:"";position:absolute;top:1px;' + (gauche ? "left" : "right") + ':1px;width:13px;height:13px;border-radius:50%;background:#D9483B;border:2px solid #fff;z-index:1;animation:fabIn .3s ease backwards}',

    /* Panneau : entrée avec léger rebond depuis le bouton, sortie plus rapide */
    '#panel{position:absolute;' + cote + ':0;' + vert + ':70px;width:' + CONFIG.LARGEUR + 'px;height:' + CONFIG.HAUTEUR + 'px;' +
      'max-height:calc(100vh - ' + (CONFIG.MARGE_Y + 90) + 'px);max-width:calc(100vw - ' + (CONFIG.MARGE_X * 2) + 'px);' +
      'background:#fff;color:' + TXT + ';border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column;' +
      'transform-origin:' + vert + ' ' + cote + ';opacity:0;transform:translateY(' + (haut ? '-16px' : '16px') + ') scale(.92);visibility:hidden;pointer-events:none;' +
      'transition:opacity .18s ease-in,transform .22s ease-in,visibility 0s linear .22s}',
    '#panel.open{opacity:1;transform:none;visibility:visible;pointer-events:auto;' +
      'transition:opacity .22s ease-out,transform .38s cubic-bezier(.34,1.45,.64,1),visibility 0s}',

    /* En-tête */
    'header{background:' + C + ';color:#fff;padding:12px 10px 12px 14px;display:flex;align-items:center;gap:10px}',
    '.av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none;overflow:hidden}',
    '.av img{width:100%;height:100%;object-fit:cover}',
    'header b{display:block;font-size:16px}header small{opacity:.85;font-size:12px}',
    '.hb{background:none;border:0;color:#fff;cursor:pointer;border-radius:8px;height:32px;min-width:32px;padding:0 6px;display:flex;align-items:center;justify-content:center;gap:5px;opacity:.85;transition:background .15s,opacity .15s,color .15s}',
    '.hb:hover{opacity:1;background:rgba(255,255,255,.16)}',
    '#clear{margin-left:auto;font-size:12px;font-weight:600}',
    '#clear.arm{opacity:1;background:#fff;color:#9A3B2E}',
    '#clear[hidden]{display:none}',
    '#close{font-size:24px;line-height:1}',

    /* Conversation */
    '#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:' + CONFIG.COULEUR_FOND + ';transition:opacity .2s ease}',
    '#log.vide{opacity:0}',
    '.m{max-width:86%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:msgIn .28s ease-out backwards}',
    '.m.calme{animation:none}',
    '.bot{align-self:flex-start;background:#fff;border:1px solid #D5DEDC;border-bottom-left-radius:4px}',
    '.user{align-self:flex-end;background:' + C + ';color:#fff;border-bottom-right-radius:4px}',
    '.err{align-self:center;color:#9A3B2E;border:1px dashed #9A3B2E;font-size:13px;background:#fff}',
    '.m a{color:inherit;text-decoration:underline}',
    '.typing{display:flex;gap:5px;align-items:center;padding:13px 14px}',
    '.typing i{width:7px;height:7px;border-radius:50%;background:#8FA3A0;animation:dot 1.2s ease-in-out infinite}',
    '.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}',

    /* Suggestions */
    '#chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:' + CONFIG.COULEUR_FOND + '}',
    '#chips button{background:#fff;border:1px solid #D5DEDC;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;color:' + TXT + ';transition:border-color .15s;animation:msgIn .3s ease-out backwards}',
    '#chips button:hover{border-color:' + C + '}',

    /* Saisie et pied */
    'form{display:flex;gap:8px;padding:10px 10px 6px;border-top:1px solid #D5DEDC;background:#fff}',
    'textarea{flex:1;resize:none;border:1px solid #D5DEDC;border-radius:10px;padding:9px 11px;font-size:14px;max-height:90px;color:' + TXT + ';background:#fff}',
    '#send{background:' + C + ';color:#fff;border:0;border-radius:10px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}',
    '#send:disabled{opacity:.5;cursor:default}',
    '#foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 8px;font-size:11px;color:#5E706D;background:#fff}',
    '#foot a{color:' + C + ';font-weight:600;white-space:nowrap}',

    /* Bulle d'invitation */
    '#teaser{position:absolute;' + vert + ':70px;' + cote + ':0;width:max-content;max-width:230px;background:#fff;color:' + TXT + ';padding:10px 28px 10px 13px;border-radius:12px;' +
      'font-size:13px;line-height:1.4;box-shadow:0 6px 22px rgba(0,0,0,.18);cursor:pointer;transform-origin:' + vert + ' ' + cote + ';animation:teaserIn .4s cubic-bezier(.34,1.56,.64,1) backwards}',
    '#teaser[hidden]{display:none}',
    '#tx{position:absolute;top:3px;right:5px;background:none;border:0;font-size:17px;line-height:1;cursor:pointer;color:#5E706D;padding:2px 4px}',

    /* Animations */
    '@keyframes fabIn{from{opacity:0;transform:scale(.3)}}',
    '@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}',
    '@keyframes teaserIn{from{opacity:0;transform:translateY(10px) scale(.85)}}',
    '@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}',
    '@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}',
    '.na *,.na *::before,.na *::after{animation:none!important;transition:none!important}',

    /* Mobile : plein écran */
    '@media(max-width:480px){#panel{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;border-radius:0;transform-origin:bottom center}' +
      '#w.ouvert #fab,#w.ouvert #teaser{display:none}}'
  ].join("");

  var avatar = CONFIG.AVATAR_URL ? '<img src="' + esc(CONFIG.AVATAR_URL) + '" alt="">' : esc(PROFIL.assistant.initiale);
  var iconeCorbeille = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

  root.innerHTML =
    '<style>' + css + '</style>' +
    '<div id="w"' + (reduit ? ' class="na"' : '') + '>' +
      '<div id="teaser" hidden><span id="tt"></span><button id="tx" type="button" aria-label="' + esc(TEXTES.masquer) + '">×</button></div>' +
      '<div id="panel" role="dialog" aria-label="' + esc(NOM) + '">' +
        '<header><div class="av" aria-hidden="true">' + avatar + '</div>' +
          '<div><b>' + esc(NOM) + '</b><small>' + esc(PROFIL.assistant.sousTitre[LANG]) + '</small></div>' +
          '<button id="clear" class="hb" type="button" hidden aria-label="' + esc(TEXTES.effacer) + '" title="' + esc(TEXTES.effacer) + '">' + iconeCorbeille + '<span id="clearTxt"></span></button>' +
          '<button id="close" class="hb" type="button" aria-label="' + esc(TEXTES.fermer) + '">×</button></header>' +
        '<div id="log" aria-live="polite"></div><div id="chips"></div>' +
        '<form id="f"><textarea id="in" rows="1" maxlength="' + CONFIG.MAX_CARACTERES + '" placeholder="' + esc(TEXTES.placeholder) + '" aria-label="' + esc(TEXTES.votreMessage) + '"></textarea>' +
          '<button id="send" type="submit">' + esc(TEXTES.envoyer) + '</button></form>' +
        '<div id="foot"><span>' + esc(TEXTES.mention) + '</span>' +
          (CONFIG.LIEN_CONTACT ? '<a href="' + esc(CONFIG.LIEN_CONTACT) + '" target="_blank" rel="noopener noreferrer">' + esc(TEXTES.contact) + '</a>' : '') + '</div>' +
      '</div>' +
      '<button id="fab" type="button" aria-label="' + esc(TEXTES.ouvrir) + '" aria-expanded="false">' +
        '<span class="ico ico-a" aria-hidden="true">' + avatar + '</span><span class="ico ico-x" aria-hidden="true">×</span></button>' +
    '</div>';

  /* ═══ 6. LOGIQUE ═══ */
  var $ = function (id) { return root.getElementById(id); };
  var w = $("w"), log = $("log"), input = $("in"), send = $("send"), panel = $("panel"), fab = $("fab"),
      chips = $("chips"), btnEffacer = $("clear"), teaser = $("teaser");
  var historique = [], occupe = false, ctrl = null, minuteurArme = null, generation = 0;
  var CLE = "marcel-chat-v1";

  function suivre(evt, info) { try { if (typeof CONFIG.SUIVI === "function") CONFIG.SUIVI(evt, info || ""); } catch (e) {} }
  function lireEtat() { try { return JSON.parse(sessionStorage.getItem(CLE)) || {}; } catch (e) { return {}; } }
  function majEtat(patch) { try { var e = lireEtat(); for (var k in patch) e[k] = patch[k]; sessionStorage.setItem(CLE, JSON.stringify(e)); } catch (e) {} }
  function sauver() { if (CONFIG.PERSISTANCE) majEtat({ historique: historique.slice(-40) }); btnEffacer.hidden = historique.length === 0; }
  function defiler() { log.scrollTo ? log.scrollTo({ top: log.scrollHeight, behavior: reduit ? "auto" : "smooth" }) : (log.scrollTop = log.scrollHeight); }

  function rendre(el, texte) {
    el.textContent = "";
    texte.split(/(https?:\/\/[^\s)<]*[^\s)<.,;:!?»"']|\*\*[^*]+\*\*)/g).forEach(function (part) {
      if (!part) return;
      if (/^https?:\/\//.test(part)) { var a = document.createElement("a"); a.href = part; a.textContent = part; a.target = "_blank"; a.rel = "noopener noreferrer"; el.appendChild(a); }
      else if (/^\*\*.+\*\*$/.test(part)) { var b = document.createElement("strong"); b.textContent = part.slice(2, -2); el.appendChild(b); }
      else el.appendChild(document.createTextNode(part));
    });
  }
  function ajouter(role, texte, calme) {
    var d = document.createElement("div"); d.className = "m " + role + (calme ? " calme" : "");
    role === "user" ? (d.textContent = texte) : rendre(d, texte);
    log.appendChild(d); defiler(); return d;
  }
  function indicateur() {
    var d = document.createElement("div"); d.className = "m bot typing";
    d.setAttribute("role", "status"); d.setAttribute("aria-label", TEXTES.ecrit);
    d.innerHTML = "<i></i><i></i><i></i>"; log.appendChild(d); defiler(); return d;
  }
  function afficherSuggestions() {
    chips.innerHTML = "";
    ((PROFIL.suggestions || {})[LANG] || []).forEach(function (s, i) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = s;
      b.style.animationDelay = (i * 60) + "ms";
      b.onclick = function () { envoyer(s); }; chips.appendChild(b);
    });
  }
  function demarrer() {
    log.innerHTML = ""; historique = [];
    ajouter("bot", PROFIL.assistant.messageAccueil[LANG], true);
    var h = CONFIG.PERSISTANCE ? (lireEtat().historique || []) : [];
    if (h.length) {
      historique = h;
      h.forEach(function (m) { ajouter(m.role === "user" ? "user" : "bot", m.content, true); });
      chips.innerHTML = "";
    } else afficherSuggestions();
    btnEffacer.hidden = historique.length === 0;
  }

  function envoyer(texte) {
    texte = (texte || "").trim(); if (!texte || occupe) return;
    var nb = lireEtat().nbMessages || 0;
    if (CONFIG.MAX_MESSAGES_SESSION && nb >= CONFIG.MAX_MESSAGES_SESSION) { ajouter("err", TEXTES.limite); return; }
    majEtat({ nbMessages: nb + 1 });

    occupe = true; send.disabled = true; chips.innerHTML = "";
    ajouter("user", texte); historique.push({ role: "user", content: texte }); sauver();
    input.value = ""; input.style.height = "auto";
    var attente = indicateur(), maGen = generation;
    suivre("message");

    ctrl = window.AbortController ? new AbortController() : null;
    var monCtrl = ctrl;
    var minuteur = setTimeout(function () { if (monCtrl) { monCtrl.raison = "delai"; monCtrl.abort(); } }, CONFIG.TIMEOUT_MS);

    var headers = { "Content-Type": "application/json" };
    if (CONFIG.GROQ_API_KEY) headers.Authorization = "Bearer " + CONFIG.GROQ_API_KEY;
    var corps = { model: CONFIG.MODEL, temperature: CONFIG.TEMPERATURE, max_tokens: CONFIG.MAX_TOKENS,
      messages: [{ role: "system", content: PROMPT }].concat(historique.slice(-CONFIG.HISTORY_LIMIT)) };
    if (CONFIG.REASONING_EFFORT) corps.reasoning_effort = CONFIG.REASONING_EFFORT;

    fetch(CONFIG.ENDPOINT, { method: "POST", headers: headers, body: JSON.stringify(corps), signal: monCtrl ? monCtrl.signal : undefined })
    .then(function (res) {
      if (res.ok) return res.json();
      return res.json().catch(function () { return {}; }).then(function (j) {
        console.warn("[" + NOM + "] HTTP " + res.status, (j.error && j.error.message) || "");   // détail technique en console, pas affiché au visiteur
        throw new Error(res.status === 429 ? TEXTES.erreur429 : TEXTES.erreurService);
      });
    })
    .then(function (data) {
      if (maGen !== generation) return;
      var r = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!r) throw new Error(TEXTES.erreurService);
      r = r.trim();
      historique.push({ role: "assistant", content: r }); sauver();
      attente.className = "m bot"; attente.removeAttribute("role"); attente.removeAttribute("aria-label");
      rendre(attente, r);
      if (!panel.classList.contains("open")) fab.classList.add("notif");
    })
    .catch(function (e) {
      if (maGen !== generation) return;
      attente.className = "m err"; attente.removeAttribute("aria-label"); historique.pop(); sauver();
      attente.textContent = e.name === "AbortError" ? TEXTES.erreurDelai : (e instanceof TypeError ? TEXTES.erreurReseau : e.message);
      suivre("erreur", e.name === "AbortError" ? "delai" : e.message);
    })
    .then(function () {
      clearTimeout(minuteur);
      if (maGen !== generation) return;
      occupe = false; send.disabled = false; ctrl = null; defiler();
    });
  }

  function effacer() {
    generation++;                                   // ignore une réponse encore en route
    if (ctrl) { ctrl.raison = "efface"; ctrl.abort(); ctrl = null; }
    occupe = false; send.disabled = false;
    log.classList.add("vide");
    setTimeout(function () {
      majEtat({ historique: [] });
      demarrer(); log.classList.remove("vide"); input.focus();
    }, reduit ? 0 : 200);
    suivre("effacement");
  }
  function desarmer() { clearTimeout(minuteurArme); btnEffacer.classList.remove("arm"); $("clearTxt").textContent = ""; }
  btnEffacer.onclick = function () {
    if (!CONFIG.CONFIRMER_EFFACEMENT || btnEffacer.classList.contains("arm")) { desarmer(); effacer(); return; }
    btnEffacer.classList.add("arm"); $("clearTxt").textContent = TEXTES.confirmerEffacer;
    minuteurArme = setTimeout(desarmer, 3000);
  };

  function cacherTeaser() { teaser.hidden = true; }
  function ouvrir(sansFocus) {
    panel.classList.add("open"); w.classList.add("ouvert");
    fab.classList.add("on", "vu"); fab.classList.remove("notif");
    fab.setAttribute("aria-expanded", "true"); fab.setAttribute("aria-label", TEXTES.fermer);
    cacherTeaser(); majEtat({ ouvert: true, vu: true });
    defiler();
    if (!sansFocus) setTimeout(function () { input.focus(); }, reduit ? 0 : 150);
    suivre("ouverture");
  }
  function fermer() {
    panel.classList.remove("open"); w.classList.remove("ouvert");
    fab.classList.remove("on");
    fab.setAttribute("aria-expanded", "false"); fab.setAttribute("aria-label", TEXTES.ouvrir);
    majEtat({ ouvert: false }); desarmer(); fab.focus();
  }

  fab.onclick = function () { panel.classList.contains("open") ? fermer() : ouvrir(); };
  $("close").onclick = fermer;
  teaser.onclick = function (e) { if (e.target.id === "tx") { e.stopPropagation(); cacherTeaser(); return; } ouvrir(); };
  root.addEventListener("keydown", function (e) { if (e.key === "Escape" && panel.classList.contains("open")) fermer(); });
  $("f").addEventListener("submit", function (e) { e.preventDefault(); envoyer(input.value); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer(input.value); } });
  input.addEventListener("input", function () { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 90) + "px"; });

  /* Démarrage */
  demarrer();
  var etat0 = lireEtat();
  if (CONFIG.PERSISTANCE && etat0.ouvert && window.innerWidth > 480) ouvrir(true);   // rouvre le chat sur la page suivante (desktop)
  if (CONFIG.TEASER_MS && !etat0.vu && !etat0.teaser) setTimeout(function () {
    if (panel.classList.contains("open")) return;
    $("tt").textContent = TEXTES.teaser; teaser.hidden = false; majEtat({ teaser: true }); suivre("teaser");
  }, CONFIG.TEASER_MS);
  if (CONFIG.OUVERTURE_AUTO_MS && !etat0.vu && !etat0.auto) setTimeout(function () {
    if (panel.classList.contains("open")) return;
    majEtat({ auto: true }); ouvrir(true);
  }, CONFIG.OUVERTURE_AUTO_MS);
})();
</script>
